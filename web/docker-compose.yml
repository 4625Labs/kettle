services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: kettle-web:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: kettle-web:latest
    restart: unless-stopped
    env_file:
      - .env
    # Placeholder heartbeat until the agents-core agent lands worker/dist/index.js.
    # Replace with: command: ["node", "worker/dist/index.js"]
    command:
      [
        "node",
        "-e",
        "setInterval(() => console.log('worker placeholder heartbeat'), 30000)",
      ]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
